receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 10s
    send_batch_size: 1024
  resource:
    attributes:
      - key: deployment.environment
        value: development
        action: upsert

exporters:
  otlphttp/logfire:
    # US Endpoint: https://logfire-us.pydantic.dev | EU Endpoint: https://logfire-eu.pydantic.dev
    endpoint: https://logfire-us.pydantic.dev
    headers:
      # Pass LOGFIRE_WRITE_TOKEN as an environment variable when launching your docker container
      Authorization: "Bearer ${LOGFIRE_WRITE_TOKEN}"
    compression: gzip
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [otlphttp/logfire, debug]
    metrics:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [otlphttp/logfire, debug]
    logs:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [otlphttp/logfire, debug]
